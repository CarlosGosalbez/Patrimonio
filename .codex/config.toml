# =============================================================================
# Patrimio — Codex Configuration
# https://github.com/openai/codex
# =============================================================================
# Instructions: AGENTS.md (root + scoped subdirectory files auto-loaded)
# Spec:         docs/patrimio-technical-spec.md
# =============================================================================

# -----------------------------------------------------------------------------
# Model — high-reasoning model; reasoning_effort passed to API for o-series models
# -----------------------------------------------------------------------------
model = "gpt-5.4"              # User requested GPT-5.4; replace with latest available model name
reasoning_effort = "high"      # Maximum reasoning depth for complex tasks

# -----------------------------------------------------------------------------
# Approval policy
#   suggest    → show code only, never apply
#   auto-edit  → apply file edits without asking, ask before running commands
#   full-auto  → apply everything without confirmation
# -----------------------------------------------------------------------------
approval_policy = "full-auto"

# Full-auto allowed after this many consecutive failures in auto-edit mode
full_auto_error_count = 3

# Load environment variables from project file (no manual export required)
env_file = ".env.local"

# Output brevity — enforced via AGENTS.md response protocol, not a native config key
# All responses must follow: small completion table + blockers only (no summaries)

# -----------------------------------------------------------------------------
# Project context
# AGENTS.md is loaded automatically (hierarchical: root + subdirectories)
# Scoped AGENTS.md loaded automatically when Codex touches files in:
#   supabase/    → supabase/AGENTS.md
#   app/api/     → app/api/AGENTS.md
#   lib/financial/ → lib/financial/AGENTS.md
# -----------------------------------------------------------------------------
project_doc = "AGENTS.md"

# Additional context files always included
context_files = [
  "docs/patrimio-technical-spec.md",
  "CLAUDE.md",
]

# -----------------------------------------------------------------------------
# Shell command allow / deny
# Mirrors .claude/settings.json permissions for consistency
# -----------------------------------------------------------------------------
[shell]
allow = [
  # Dev
  "npm run dev",
  "npm run build",
  "npm run start",
  "npm run type-check",

  # Quality
  "npm run lint",
  "npm run lint:fix",
  "npm run format",
  "npm run format:check",

  # Tests
  "npm run test",
  "npm run test:watch",
  "npm run test:e2e",
  "vitest",
  "playwright test",

  # Supabase (remote --linked mode only — Docker not required)
  "npm run db:push",
  "npm run db:types",
  "npm run db:diff",
  "npx supabase link",
  "npx supabase db diff",
  "npx supabase db diff -f",
  "npx supabase db push",
  "npx supabase gen types typescript",

  # Git (read-only + safe writes)
  "git status",
  "git diff",
  "git log",
  "git add",
  "git commit",
  "git branch",
  "git checkout",
  "git stash",

  # TypeScript
  "npx tsc --noEmit",
  "npx tsc",
]

deny = [
  # Destructive
  "rm -rf",
  "rmdir /s",

  # Docker — never use (all Supabase ops remote via Management API)
  "docker",
  "docker-compose",
  "supabase start",
  "supabase stop",
  "supabase status",

  # Network fetching (use lib/market/fetcher.ts instead)
  "curl",
  "wget",
  "fetch",

  # Dangerous git ops (require human confirmation)
  "git push",
  "git push --force",
  "git reset --hard",
  "git clean -fd",

  # Supabase local Docker — always use remote (SUPABASE_ACCESS_TOKEN + --linked) instead
  "npx supabase start",
  "npx supabase stop",
  "npx supabase status",

  # Supabase destructive
  "npx supabase db reset",
  "npx supabase db reset --local",

  # Never expose secrets
  "cat .env",
  "cat .env.local",
  "echo $SUPABASE",
  "echo $ANTHROPIC",
]

# -----------------------------------------------------------------------------
# History
# -----------------------------------------------------------------------------
[history]
persist = "workspace"   # "workspace" | "global" | false
max_entries = 100
path = ".codex/history"

# -----------------------------------------------------------------------------
# Notifications
# -----------------------------------------------------------------------------
[notify]
on_complete = true
browser = false

# -----------------------------------------------------------------------------
# Agent team  — mirrors .claude/settings.json CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS
# Each entry maps a role name to its instruction file
# Codex reads these as context when the task matches the role's domain
# -----------------------------------------------------------------------------
[agents]
default         = "project-orchestrator"

  [agents.project-orchestrator]
  file     = "AGENTS.md"
  triggers = ["feature", "bug", "architecture", "multi-layer"]

  [agents.db-architect]
  file     = "supabase/AGENTS.md"
  triggers = ["migration", "schema", "rls", "index", "trigger", "supabase"]

  [agents.security-reviewer]
  file     = "app/api/AGENTS.md"
  triggers = ["api route", "auth", "jwt", "rls", "owasp", "security"]

  [agents.financial-domain]
  file     = "lib/financial/AGENTS.md"
  triggers = ["amount", "cents", "formatCurrency", "financial", "importe"]

# -----------------------------------------------------------------------------
# Skills — on-demand domain knowledge
# Codex loads these files as context when the task matches
# (mirrors .claude/skills/ and .github/skills/ structure)
# -----------------------------------------------------------------------------
[skills]

  [skills.supabase-migration]
  file        = ".claude/skills/supabase-migration/SKILL.md"
  auto_load   = true
  triggers    = ["migration", "CREATE TABLE", "ALTER TABLE", "rls", "supabase db"]

  [skills.transaction-formatter]
  file        = ".claude/skills/transaction-formatter/SKILL.md"
  auto_load   = true
  triggers    = ["formatCurrency", "centsToDec", "decToCents", "importe", "display amount"]

  [skills.spanish-finance-categorizer]
  file        = ".claude/skills/spanish-finance-categorizer/SKILL.md"
  auto_load   = false
  triggers    = ["categorize", "import", "csv", "banco", "merchant"]

  [skills.market-data-fetcher]
  file        = ".claude/skills/market-data-fetcher/SKILL.md"
  auto_load   = false
  triggers    = ["stock", "quote", "ticker", "market", "investment price"]

  [skills.anomaly-detector]
  file        = ".claude/skills/anomaly-detector/SKILL.md"
  auto_load   = false
  triggers    = ["anomaly", "alert", "unusual", "duplicate", "outlier"]

  [skills.report-generator]
  file        = ".claude/skills/report-generator/SKILL.md"
  auto_load   = false
  triggers    = ["pdf", "report", "excel", "export", "irpf", "informe"]

  [skills.context-optimizer]
  file        = ".claude/skills/context-optimizer/SKILL.md"
  auto_load   = false
  triggers    = ["context", "compaction", "token", "limit"]

# -----------------------------------------------------------------------------
# Rules — path-scoped rule files auto-injected as context
# Mirrors .claude/rules/ (same files referenced for completeness)
# -----------------------------------------------------------------------------
[rules]

  [rules.security]
  file     = ".claude/rules/security.md"
  apply_to = ["app/api/**", "lib/supabase/**", "middleware.ts"]

  [rules.database]
  file     = ".claude/rules/database.md"
  apply_to = ["supabase/**", "types/database.ts"]

  [rules.financial]
  file     = ".claude/rules/financial.md"
  apply_to = ["lib/financial/**", "types/financial.ts", "components/charts/**"]

  [rules.frontend]
  file     = ".claude/rules/frontend.md"
  apply_to = ["app/**/*.tsx", "components/**", "hooks/**", "stores/**"]

  [rules.ai-agents]
  file     = ".claude/rules/ai-agents.md"
  apply_to = ["app/api/ai/**", "lib/ai/**"]

  [rules.testing]
  file     = ".claude/rules/testing.md"
  apply_to = ["tests/**", "**/*.test.ts", "**/*.spec.ts", "playwright.config.ts", "vitest.config.ts"]

# -----------------------------------------------------------------------------
# Environment — variables Codex may read (values from .env.local, never hardcoded)
# -----------------------------------------------------------------------------
[env]
required = [
  "NEXT_PUBLIC_SUPABASE_URL",
  "NEXT_PUBLIC_SUPABASE_ANON_KEY",
  "ANTHROPIC_API_KEY",
]
optional = [
  "SUPABASE_SERVICE_ROLE_KEY",
  "ALPHA_VANTAGE_API_KEY",
  "FMP_API_KEY",
  "SENTRY_DSN",
]
# NEVER read: SUPABASE_SERVICE_ROLE_KEY must never appear in client-side code
never_expose_to_client = [
  "SUPABASE_SERVICE_ROLE_KEY",
  "ANTHROPIC_API_KEY",
]

# -----------------------------------------------------------------------------
# Output behavior — mirrors anti-waste protocol from AGENTS.md
# -----------------------------------------------------------------------------
[output]
# After completing work, always end with:
#   ✅ Small table of completed steps (max 5 rows)
#   ⚠️ Blockers or pending items (if any)
# NEVER write extensive summaries, re-list code, or provide recap sections.
compact_responses = true
response_language = "es"  # Always respond in Spanish to the user

# -----------------------------------------------------------------------------
# Global coding rules — applied to ALL tasks regardless of file type
# -----------------------------------------------------------------------------
[coding_rules]

  # i18n — internationalisation required everywhere
  [coding_rules.i18n]
  library      = "next-intl"                    # Only approved i18n library
  message_path = "messages/[locale].json"       # es.json (default), en.json (fallback)
  locales      = ["es", "en"]
  default      = "es"
  rules = [
    "Every UI string must use useTranslations() or getTranslations() — no hardcoded text",
    "New components: extract ALL display strings to messages/ BEFORE committing",
    "Existing components being modified: migrate hardcoded strings to t() calls",
    "Currency/dates: use lib/financial/formatters.ts + next-intl useFormatter(), never raw Intl.*",
    "DB: multilingual user-visible text uses JSONB name_i18n pattern",
    "FTS indexes: always specify language config ('spanish', 'english', or 'simple' for multilingual)",
  ]

  # UX/UI — approved design system
  [coding_rules.ui]
  primary_library     = "shadcn/ui"             # Community gold standard for Next.js 2024-2026
  primitives          = "Radix UI"              # Accessible headless primitives under shadcn/ui
  styling             = "Tailwind CSS v4"       # Zero-runtime utility-first
  charts              = "Recharts"              # React-native, ResponsiveContainer-first
  icons               = "Lucide React"          # Official shadcn/ui icon set
  rules = [
    "Never install MUI, Ant Design, Chakra UI, or any alternative component library",
    "Always use cn() from lib/utils.ts for conditional class merging",
    "Colors via CSS variables (--color-primary) — never hardcoded hex values",
    "Dark mode via Tailwind dark: variants — never conditional JS class injection",
    "Charts always wrapped in ResponsiveContainer width=100%",
    "Every interactive element: min-h-[44px] (Apple HIG touch target minimum)",
    "Layouts: mobile-first (sm → md → lg) — never desktop-first",
  ]

  # Dependency freshness
  [coding_rules.dependencies]
  rules = [
    "Before using any API/prop/import: verify it is NOT deprecated in installed version",
    "New packages: always install @latest unless documented incompatibility exists",
    "After major upgrades: scan CHANGELOG for deprecated APIs and update all call sites",
    "Never ignore peer dependency warnings — resolve before committing",
    "Run npm audit after every package install — fix HIGH/CRITICAL before committing",
    "Deprecated Supabase: @supabase/auth-helpers-nextjs → use @supabase/ssr",
    "Deprecated Next.js: next/head, getServerSideProps, getStaticProps, useRouter from next/router",
    "Current correct: metadata export in layout/page, RSC async components, useRouter from next/navigation",
  ]
