version: 2

updates:
  # ──────────────────────────────────────────────────────────────
  # 1. npm — Next.js app (raíz del proyecto)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 10
    # Agrupar todas las actualizaciones de producción en un solo PR
    groups:
      nextjs-ecosystem:
        patterns:
          - "next"
          - "next-*"
          - "react"
          - "react-dom"
          - "@types/react*"
      supabase:
        patterns:
          - "@supabase/*"
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
      sentry:
        patterns:
          - "@sentry/*"
      radix-ui:
        patterns:
          - "@radix-ui/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@playwright/*"
          - "playwright"
          - "jsdom"
        update-types:
          - "minor"
          - "patch"
      dev-tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "prettier"
          - "husky"
          - "lint-staged"
          - "typescript"
          - "tailwindcss*"
          - "autoprefixer"
          - "postcss"
        update-types:
          - "minor"
          - "patch"
    # No abrir PRs para dependencias que siguen un esquema de versión personalizado
    ignore:
      # xlsx se instala desde CDN personalizado — no actualizar automáticamente
      - dependency-name: "xlsx"

  # ──────────────────────────────────────────────────────────────
  # 2. GitHub Actions — workflows en .github/workflows/
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
