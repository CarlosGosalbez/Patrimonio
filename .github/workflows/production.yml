name: Production Deploy

on:
    workflow_run:
        workflows: [ CI ]
        types: [ completed ]
        branches: [ main ]

# Only one production deploy at a time
concurrency:
    group: production
    cancel-in-progress: false

jobs:
    pre-deploy-verification:
        name: Pre-Deploy Verification
        runs-on: ubuntu-latest
        if: github.event.workflow_run.conclusion == 'success'
        env:
            NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG: ${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
            SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: "20"
                  cache: "npm"
            - run: npm ci
            - name: Run pre-deploy verification
              run: |
                  echo "🔍 Pre-Deploy Verification"
                  echo "[1/4] TypeScript compilation..."
                  npm run type-check
                  echo "[2/4] ESLint validation..."
                  npm run lint
                  echo "[3/4] Production build..."
                  npm run build
                  echo "[4/4] Security audit..."
                  npm audit --audit-level=high || true
                  echo "✅ Pre-deploy verification PASSED"

    deploy:
        name: Deploy to Vercel
        runs-on: ubuntu-latest
        needs: [ pre-deploy-verification ]
        if: github.event.workflow_run.conclusion == 'success'
        environment: production
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: "20"
                  cache: "npm"
            - run: npm ci
            - name: Deploy to Vercel (production)
              run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    smoke-tests:
        name: Smoke Tests
        runs-on: ubuntu-latest
        needs: [ deploy ]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: "20"
                  cache: "npm"
            - run: npm ci
            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium
            - name: Run smoke tests
              run: npx playwright test tests/e2e/smoke --project=desktop
              env:
                  BASE_URL: https://patrimio.vercel.app
                  TEST_USER_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
                  TEST_USER_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}

    sentry-release:
        name: Sentry Release
        runs-on: ubuntu-latest
        needs: [ deploy ]
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - name: Create Sentry release
              uses: getsentry/action-release@v3
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
              with:
                  environment: production
                  sourcemaps: .next/static/chunks
