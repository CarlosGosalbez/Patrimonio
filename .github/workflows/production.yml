name: Production Deploy

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]

# Only one production deploy at a time
concurrency:
    group: production
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy to Vercel
        runs-on: ubuntu-latest
        if: github.event.workflow_run.conclusion == 'success'
        environment: production
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
            - run: npm ci
            - name: Deploy to Vercel (production)
              run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    smoke-tests:
        name: Smoke Tests
        runs-on: ubuntu-latest
        needs: [deploy]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
            - run: npm ci
            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium
            - name: Run smoke tests
              run: npx playwright test tests/e2e/smoke --project=desktop
              env:
                  BASE_URL: https://patrimio.vercel.app
                  TEST_USER_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
                  TEST_USER_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}

    sentry-release:
        name: Sentry Release
        runs-on: ubuntu-latest
        needs: [deploy]
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Create Sentry release
              uses: getsentry/action-release@v1
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
              with:
                  environment: production
                  sourcemaps: .next/static/chunks
