name: Test & Coverage Report

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    test-coverage:
        name: Unit Tests + Coverage
        runs-on: ubuntu-latest
        env:
            NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        outputs:
            coverage_pct: ${{ steps.coverage.outputs.coverage_pct }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: "20"
                  cache: "npm"

            - run: npm ci

            - name: Run unit tests with coverage
              id: coverage
              run: |
                  npm run test:coverage -- --reporter=verbose 2>&1 | tee /tmp/vitest-output.txt
                  # Extract coverage percentage from json-summary
                  if [ -f coverage/coverage-summary.json ]; then
                    PCT=$(node -e "const s = require('./coverage/coverage-summary.json'); console.log(Math.round(s.total.lines.pct))")
                    echo "coverage_pct=$PCT" >> "$GITHUB_OUTPUT"
                    echo "Coverage: $PCT%"
                  fi

            - name: Upload coverage artifacts
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 14

            - name: Coverage comment on PR
              if: github.event_name == 'pull_request'
              uses: davelosert/vitest-coverage-report-action@v2
              continue-on-error: true
              with:
                  json-summary-path: coverage/coverage-summary.json

            - name: Create Sentry release with test context
              if: env.SENTRY_AUTH_TOKEN != ''
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
              run: |
                  RELEASE_NAME="test-run-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}"
                  npx @sentry/cli releases new "$RELEASE_NAME" || true
                  npx @sentry/cli releases set-commits "$RELEASE_NAME" --auto || true
                  npx @sentry/cli releases finalize "$RELEASE_NAME" || true
                  # Tag the release with test metadata
                  npx @sentry/cli releases deploys "$RELEASE_NAME" new \
                    -e "testing" \
                    --started "$(date +%s)" \
                    --finished "$(date +%s)" || true

    e2e-security:
        name: E2E Security Tests
        runs-on: ubuntu-latest
        needs: test-coverage
        env:
            PLAYWRIGHT_TEST_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: "20"
                  cache: "npm"

            - run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install chromium --with-deps

            - name: Run security penetration tests
              run: npx playwright test tests/e2e/security-penetration.spec.ts --reporter=html
              env:
                  PLAYWRIGHT_TEST_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
              continue-on-error: true # Non-blocking until we have a stable test environment

            - name: Upload Playwright report
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: playwright-security-report
                  path: playwright-report/
                  retention-days: 7

    coverage-gate:
        name: Coverage Gate (≥ 80%)
        runs-on: ubuntu-latest
        needs: test-coverage
        steps:
            - name: Check coverage threshold
              run: |
                  PCT="${{ needs.test-coverage.outputs.coverage_pct }}"
                  echo "Coverage: ${PCT}%"
                  if [ -z "$PCT" ]; then
                    echo "⚠️ Could not read coverage percentage — skipping gate"
                    exit 0
                  fi
                  if [ "$PCT" -lt 80 ]; then
                    echo "❌ Coverage ${PCT}% is below the 80% threshold"
                    exit 1
                  fi
                  echo "✅ Coverage ${PCT}% meets the 80% threshold"
